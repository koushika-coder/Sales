databases:
  - name: sales-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: sales-api
    runtime: docker
    plan: free
    region: oregon
    branch: sales_complted
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      - key: ConnectionStrings__DefaultConnection
        value: postgresql://sales_db_kdnh_user:hOUAwNEWakCEjnxJqit58YdqJbTlB9O0@dpg-d9216lbtqb8s73b68cig-a/sales_db_kdnh

      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: SalesReconciliationApp
      - key: Jwt__Audience
        value: SalesReconciliationClient
      - key: Jwt__ExpirationMinutes
        value: "1440"

      - key: GoogleOAuth__ClientId
        sync: false
      - key: GoogleOAuth__ClientSecret
