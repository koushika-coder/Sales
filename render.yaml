databases:
  - name: sales-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: sales-api
    runtime: docker
    plan: free
    region: oregon
    branch: sales_complted
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # Render-managed free PostgreSQL — connection string supplied automatically.
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: sales-db
          property: connectionString

      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: SalesReconciliationApp
      - key: Jwt__Audience
        value: SalesReconciliationClient
      - key: Jwt__ExpirationMinutes
        value: "1440"

      - key: GoogleOAuth__ClientId
        sync: false
      - key: GoogleOAuth__ClientSecret
        sync: false

      - key: Email__SmtpHost
        value: smtp.gmail.com
      - key: Email__SmtpPort
        value: "587"
      - key: Email__SenderEmail
        sync: false
      - key: Email__SenderPassword
        sync: false
      - key: Email__RecipientEmail
        sync: false

      # Comma-separated list of allowed frontend origins, e.g. your deployed
      # Vite app's URL — set once that's deployed.
      - key: Cors__AllowedOrigins
        sync: false
