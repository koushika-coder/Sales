databases:
  - name: sales-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: sales-api
    runtime: docker
    plan: free
    region: oregon
    branch: sales_complted
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ConnectionStrings__DefaultConnection is intentionally not set here —
      # Render wasn't applying it to this service for unknown reasons, so the
      # real value lives directly in appsettings.json instead.

      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: SalesReconciliationApp
      - key: Jwt__Audience
        value: SalesReconciliationClient
      - key: Jwt__ExpirationMinutes
        value: "1440"

      - key: GoogleOAuth__ClientId
        sync: false
      - key: GoogleOAuth__ClientSecret
        sync: false

      - key: Email__SmtpHost
        value: smtp.gmail.com
      - key: Email__SmtpPort
        value: "587"
      - key: Email__SenderEmail
        sync: false
      - key: Email__SenderPassword
        sync: false
      - key: Email__RecipientEmail
        sync: false

      # Cors__AllowedOrigins is intentionally not set here — same reason as
      # the DB connection string above. The real value lives in
      # appsettings.json under Cors:AllowedOrigins.
